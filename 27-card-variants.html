  <style>

:root{--ink:#172033;--muted:#64748b;--paper:#f7f8fc;--surface:#fff;--brand:#3157d5;--brand-dark:#203da0;--line:#dbe2ef;--accent:#c8f169;--radius:18px;--space:1rem}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}header,main,section,footer{padding:clamp(1.1rem,4vw,3rem);max-width:1120px;margin-inline:auto}h1,h2,h3{line-height:1.15;letter-spacing:-.025em}h1{font-size:clamp(2rem,5vw,3.8rem);max-width:850px}h2{font-size:clamp(1.35rem,3vw,2rem)}p{max-width:72ch;color:var(--muted)}a{color:var(--brand);text-underline-offset:4px}img{display:block;max-width:100%;height:auto;border-radius:12px}button,.button{display:inline-block;border:0;border-radius:999px;background:var(--brand);color:white;padding:.75rem 1.15rem;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}button:hover,.button:hover{background:var(--brand-dark)}input,select,textarea{width:100%;padding:.75rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:white;margin:.35rem 0 1rem}label{display:block;font-weight:600}form{max-width:560px;background:white;padding:1.5rem;border:1px solid var(--line);border-radius:var(--radius)}fieldset{border:1px solid var(--line);border-radius:12px;margin:1rem 0;padding:1rem}fieldset label{display:inline-flex;align-items:center;gap:.5rem;margin-right:1rem}fieldset input,input[type=checkbox],input[type=radio]{width:auto;margin:.25rem}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}caption{text-align:left;padding:.75rem;font-weight:700}th,td{padding:.85rem;text-align:left;border-bottom:1px solid var(--line)}th{background:#eaf0ff}nav{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}nav a{text-decoration:none;color:var(--ink);font-weight:650}.navbar{display:flex;align-items:center;justify-content:space-between;gap:1rem}.brand{font-weight:850;font-size:1.2rem;text-decoration:none;color:var(--ink)}.eyebrow{font-size:.75rem;font-weight:850;letter-spacing:.15em;color:var(--brand)}.cards,.products,.product-grid,.gallery,.project-grid,.service-grid,.feature-grid,.responsive-cards,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1rem}.cards article,.products article,.product-grid article,.gallery figure,.project,.service-grid article,.feature-grid article,.responsive-cards article,.stats article{margin:0;background:var(--surface);padding:1.25rem;border:1px solid var(--line);border-radius:var(--radius)}.gallery figure{padding:.6rem}.gallery figcaption{padding:.5rem}.hero,.landing,.split-hero,.final-hero,.desktop-hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2rem;padding-block:clamp(2rem,7vw,6rem)}.hero-copy,.landing-copy{max-width:620px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:1.5rem}.text-link{font-weight:700}.tagline{font-weight:650;color:var(--brand)}.token-card{max-width:560px;background:var(--surface);padding:1.5rem;margin:1rem 0;border-radius:var(--radius);border:1px solid var(--line)}.token-card.secondary{background:#edf4ff}.margin-box{background:#fde7b0;padding:30px;margin:20px;max-width:620px}.border-box{border:10px solid #3157d5;padding:20px;background:#dce7ff}.padding-box{padding:24px;background:#c8f169}.content-box{background:white;text-align:center;padding:25px;font-weight:800}.note{background:#fff7dd;padding:1rem;border-left:4px solid #d49b20}.safe-box{max-width:100%;overflow-wrap:anywhere;background:white;border:1px solid var(--line);border-radius:12px;padding:1rem}.card.soft{background:#eaf0ff}.card.outlined{background:white;border:2px solid #3157d5}.card.elevated{box-shadow:0 18px 40px #1720331c}.profile{text-align:center}.avatar{display:grid;place-items:center;width:72px;height:72px;margin:auto;border-radius:50%;background:var(--accent);font-weight:900;font-size:1.4rem}.product-content{padding:.5rem}.orb{position:absolute;width:230px;height:230px;border-radius:50%;background:var(--accent);right:10%;top:5%;z-index:0;opacity:.8}.hero{position:relative;overflow:hidden}.hero-copy{position:relative;z-index:1}.landing-art{display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap}.art-card{background:white;border:1px solid var(--line);border-radius:20px;padding:1.5rem;min-width:150px;box-shadow:0 14px 35px #17203312}.art-card span{color:var(--brand);font-weight:900}.gallery img{aspect-ratio:4/3;object-fit:cover}.products article,.product-grid article{padding:.8rem}.products img,.product-grid img{width:100%;aspect-ratio:4/3;object-fit:cover}.dashboard{display:grid;grid-template-areas:"header header" "side main" "footer footer";grid-template-columns:220px 1fr;min-height:90vh;max-width:1200px;margin:auto;background:white}.dash-header{grid-area:header;display:flex;justify-content:space-between;background:#172033;color:white}.dash-side{grid-area:side;background:#f0f3fa;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}.dash-main{grid-area:main}.dash-footer{grid-area:footer;background:#f0f3fa}.stats article strong{display:block;font-size:2rem}.shop-layout{display:grid;grid-template-columns:220px 1fr;grid-template-areas:"head head" "side main" "foot foot";max-width:1200px;margin:auto}.shop-layout>header{grid-area:head;display:flex;justify-content:space-between;align-items:center}.shop-layout>aside{grid-area:side;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}.shop-layout>main{grid-area:main}.shop-layout>footer{grid-area:foot;background:#eaf0ff}.project{min-height:220px;display:flex;flex-direction:column;justify-content:end;background:#eaf0ff}.project.featured{background:#dce7ff}.project span{font-size:.75rem;font-weight:850;color:var(--brand);letter-spacing:.12em}.responsive-header{display:flex;justify-content:space-between;align-items:center;gap:1rem}.audit-layout{display:grid;grid-template-columns:minmax(180px,1fr) 3fr;gap:1rem}.audit-layout aside,.audit-layout main{padding:1.5rem;background:white;border:1px solid var(--line);border-radius:var(--radius)}.audit-layout img{width:100%}.split-hero{align-items:start}.feature-grid article{min-height:140px}.desktop-hero{min-height:580px;background:#eaf0ff;border-radius:24px;margin-top:1rem}.hero-visual{min-height:320px;position:relative;background:#c8f169;border-radius:24px}.visual-card{position:absolute;background:white;padding:1.3rem;border-radius:14px;font-weight:850;box-shadow:0 15px 30px #17203318}.visual-card.one{top:15%;left:10%}.visual-card.two{top:42%;right:8%}.visual-card.three{bottom:12%;left:22%}.final-hero{background:#eaf0ff;border-radius:24px;margin-top:1rem;overflow:hidden}.hero-art{min-height:330px;position:relative;display:grid;place-items:center;background:#c8f169;border-radius:24px;overflow:hidden}.art-panel{position:absolute;padding:1.5rem;background:#fff;border-radius:18px;font-size:1.5rem;font-weight:900;box-shadow:0 18px 35px #17203320}.panel-a{transform:rotate(-8deg);left:8%;top:20%}.panel-b{transform:rotate(7deg);right:8%;bottom:15%;background:#3157d5;color:white}.art-dot{width:120px;height:120px;border-radius:50%;background:#f8b4a7}.services{display:grid;grid-template-columns:.8fr 1.2fr;gap:2rem}.service-grid article span{color:var(--brand);font-weight:900}.about{background:white;border-radius:24px;margin-block:1rem}footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid var(--line)}.small-note{font-size:.85rem}.muted{font-size:.85rem}.login-wrap{min-height:80vh;display:grid;place-items:center}.login{width:min(100%,440px)}.login button{width:100%}
@media(max-width:900px){.hero,.landing,.split-hero,.final-hero,.desktop-hero,.services{grid-template-columns:1fr}.dashboard{grid-template-areas:"header" "side" "main" "footer";grid-template-columns:1fr}.dash-side{flex-direction:row;flex-wrap:wrap}.shop-layout{grid-template-columns:1fr;grid-template-areas:"head" "side" "main" "foot"}.shop-layout>aside{flex-direction:row;flex-wrap:wrap}.audit-layout{grid-template-columns:1fr}.hero-art{min-height:260px}.desktop-hero{min-height:auto}}
@media(max-width:600px){header,main,section,footer{padding:1rem}.navbar,.responsive-header{align-items:flex-start;flex-direction:column}.navbar nav,.responsive-header nav{gap:.75rem}.orb{width:140px;height:140px}.margin-box{margin:8px;padding:16px}.border-box{padding:12px}.padding-box{padding:12px}.content-box{padding:14px}.art-panel{font-size:1.1rem}.services{gap:1rem}}

  </style>

<body>
<h1>Card Design Variants</h1><div class="cards"><article class="card soft"><h2>Soft</h2><p>Subtle background and rounded corners.</p></article><article class="card outlined"><h2>Outlined</h2><p>Clear border and minimal decoration.</p></article><article class="card elevated"><h2>Elevated</h2><p>Raised appearance with a soft shadow.</p></article></div>
